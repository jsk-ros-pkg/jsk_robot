# ROS 2: all hardware starts unconfigured; modular_hand_manager activates the detacher and the tool
/**/controller_manager:
  ros__parameters:
    update_rate: 50
    hardware_components_initial_state:
      unconfigured: [rhand_detacher, rhand_generic, rhand_gripper, rhand_needle_holder, rhand_forceps, rhand_yubi]

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_group_effort_controller:
      type: effort_controllers/JointGroupEffortController
    generic_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
    gripper_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
    needle_holder_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
    yubi_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
    forceps_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

/**/joint_group_effort_controller:
  ros__parameters:
    joints: [rhand_detach_joint_0]

/**/generic_gripper_controller:
  ros__parameters:
    joint: rhand_generic_joint
    max_effort_interface: rhand_generic_joint/effort
    allow_stalling: true

/**/gripper_gripper_controller:
  ros__parameters:
    joint: rhand_gripper_joint
    max_effort_interface: rhand_gripper_joint/effort
    allow_stalling: true

/**/needle_holder_gripper_controller:
  ros__parameters:
    joint: rhand_needle_holder_joint
    max_effort_interface: rhand_needle_holder_joint/effort
    allow_stalling: true

/**/forceps_gripper_controller:
  ros__parameters:
    joint: rhand_forceps_joint
    max_effort_interface: rhand_forceps_joint/effort
    allow_stalling: true

/**/yubi_gripper_controller:
  ros__parameters:
    joint: rhand_yubi_joint
    max_effort_interface: rhand_yubi_joint/effort
    allow_stalling: true
