[project]
name = "dynamixel-detachable-hand"
version = "0.1.0"
description = "ROS 2 detachable surgical tool module using Dynamixelhand model, control and euslisp/python utilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Michitoshi Tsubaki", email = "tsubaki@jsk.t.u-tokyo.ac.jp" },
]
maintainers = [
  { name = "Michitoshi Tsubaki", email = "tsubaki@jsk.t.u-tokyo.ac.jp" },
]
dependencies = [
  "PyYAML>=5.4",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
